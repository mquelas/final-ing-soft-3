name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  REPOSITORY: ${{ vars.REPOSITORY }}
  BACKEND_SERVICE_QA: final-ing-3-api-qa-quelas-rivero
  BACKEND_SERVICE_PROD: final-ing-3-api-prod-quelas-rivero
  FRONTEND_SERVICE_QA: final-ing-3-web-qa-quelas-rivero
  FRONTEND_SERVICE_PROD: final-ing-3-web-prod-quelas-rivero

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-backend:
    name: Build Backend Image
    needs: tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGISTRY_HOST

      - id: vars
        run: |
          IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/backend:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ${{ steps.vars.outputs.image }} .

      - name: Push backend image
        run: docker push ${{ steps.vars.outputs.image }}

      - id: publish
        run: echo "image=${{ steps.vars.outputs.image }}" >> $GITHUB_OUTPUT

  build-frontend-qa:
    name: Build Frontend Image (QA)
    needs: tests
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      API_URL: ${{ secrets.QA_API_URL }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGISTRY_HOST

      - id: vars
        run: |
          IMAGE="${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/frontend-qa:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg API_URL="${API_URL}" -t ${{ steps.vars.outputs.image }} .

      - name: Push frontend image
        run: docker push ${{ steps.vars.outputs.image }}

      - id: publish
        run: echo "image=${{ steps.vars.outputs.image }}" >> $GITHUB_OUTPUT

  deploy-backend-qa:
    name: Deploy Backend to QA
    needs:
      - build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE_QA }}
          image: ${{ needs.build-backend.outputs.image }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL_QA }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
            ENVIRONMENT=qa
          flags: --allow-unauthenticated

      - name: Health check backend QA
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in {1..5}; do
            if curl -fsSL "$URL/health" || curl -fsSL "$URL"; then
              echo "Backend QA healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend QA health check failed" >&2
          exit 1

  deploy-frontend-qa:
    name: Deploy Frontend to QA
    needs:
      - build-frontend-qa
    runs-on: ubuntu-latest
    outputs:
      frontend_url: ${{ steps.publish-url.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_QA }}
          image: ${{ needs.build-frontend-qa.outputs.image }}
          region: ${{ vars.GCP_REGION }}
          flags: --allow-unauthenticated

      - id: publish-url
        run: echo "url=${{ steps.deploy.outputs.url }}" >> $GITHUB_OUTPUT

      - name: Health check frontend QA
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in {1..5}; do
            if curl -fsSL "$URL"; then
              echo "Frontend QA healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Frontend QA health check failed" >&2
          exit 1

  qa-smoke-tests:
    name: QA Smoke Tests (post-deploy)
    needs:
      - deploy-backend-qa
      - deploy-frontend-qa
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Backend QA health endpoint
        env:
          QA_API_URL: ${{ secrets.QA_API_URL }}
        run: |
          if [ -z "$QA_API_URL" ]; then
            echo "QA_API_URL secret is not set. Please configure it with the Cloud Run URL." >&2
            exit 1
          fi
          echo "Polling ${QA_API_URL}/health..."
          for attempt in {1..30}; do
            STATUS=$(curl -s -o /tmp/health_body -w "%{http_code}" "${QA_API_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend health check passed with HTTP 200."
              exit 0
            fi
            echo "Attempt ${attempt}: received HTTP ${STATUS}"
            if [ -f /tmp/health_body ]; then
              echo "Response body:"
              cat /tmp/health_body
            fi
            sleep 5
          done
          echo "Backend QA health endpoint did not respond successfully after multiple attempts." >&2
          exit 1

  sonar-quality-gate:
    name: SonarCloud Quality Gate (post-QA)
    needs:
      - qa-smoke-tests
      - tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: artifacts/frontend

      - uses: actions/download-artifact@v4
        with:
          name: backend-unit-tests
          path: artifacts/backend

      - name: Normalize coverage paths
        run: |
          mkdir -p frontend/coverage backend
          BACKEND_COV=$(find artifacts -name 'coverage.xml' | head -n1)
          FRONTEND_LCOV=$(find artifacts -name 'lcov.info' | head -n1)
          if [ -z "$BACKEND_COV" ]; then
            echo "backend coverage.xml not found in artifacts"; exit 1;
          fi
          if [ -z "$FRONTEND_LCOV" ]; then
            echo "frontend lcov.info not found in artifacts"; exit 1;
          fi
          cp "$BACKEND_COV" backend/coverage.xml
          cp "$FRONTEND_LCOV" frontend/coverage/lcov.info

      - name: Verify coverage reports
        run: |
          ls -l frontend/coverage || true
          ls -l backend || true
          if [ ! -s frontend/coverage/lcov.info ]; then
            echo "lcov.info not found or empty"; exit 1; 
          fi
          if [ ! -s backend/coverage.xml ]; then
            echo "backend coverage.xml not found or empty"; exit 1;
          fi

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=mquelas_final-ing-soft-3
            -Dsonar.organization=mquelas
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.tests=backend/tests,frontend/src
            -Dsonar.exclusions=**/*.spec.ts,frontend/src/test.ts
            -Dsonar.test.inclusions=frontend/src/**/*.spec.ts
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8

  e2e-qa:
    name: E2E Cypress QA
    needs:
      - qa-smoke-tests
      - deploy-frontend-qa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      CYPRESS_BASE_URL: ${{ needs.deploy-frontend-qa.outputs.frontend_url }}
      CYPRESS_API_URL: ${{ secrets.QA_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E against QA
        run: npx cypress run --browser chrome --config baseUrl="$CYPRESS_BASE_URL"

  integration-tests:
    name: Integration Tests (post-QA)
    needs:
      - qa-smoke-tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_QA }}
      QA_BASE_URL: ${{ secrets.QA_API_URL }}
      GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Prepare Google credentials
        if: ${{ env.GOOGLE_CREDS_JSON != '' }}
        env:
          CREDS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$CREDS_JSON" > $HOME/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-creds.json" >> $GITHUB_ENV

      - name: Run integration tests
        working-directory: backend
        run: pytest -m integration --no-cov --junitxml=pytest-integration.xml

      - name: Upload integration report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-tests
          path: backend/pytest-integration.xml
          if-no-files-found: ignore

  approval-prod:
    name: Approval for Production
    needs:
      - integration-tests
      - e2e-qa
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - run: echo "Approve this job to continue with production deployment."

  deploy-backend-prod:
    name: Deploy Backend to Production
    needs:
      - approval-prod
      - build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE_PROD }}
          image: ${{ needs.build-backend.outputs.image }}
          region: ${{ vars.GCP_REGION }}
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}
            ENVIRONMENT=production
          flags: --allow-unauthenticated

      - name: Health check backend Prod
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in {1..5}; do
            if curl -fsSL "$URL/health" || curl -fsSL "$URL"; then
              echo "Backend Prod healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Backend Prod health check failed" >&2
          exit 1

  build-frontend-prod:
    name: Build Frontend Image (Prod)
    needs: approval-prod
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      API_URL: ${{ secrets.PROD_API_URL }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker $REGISTRY_HOST

      - id: vars
        run: echo "image=${REGISTRY_HOST}/${PROJECT_ID}/${REPOSITORY}/frontend-prod:${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile --build-arg API_URL="${API_URL}" -t ${{ steps.vars.outputs.image }} .

      - name: Push frontend image
        run: docker push ${{ steps.vars.outputs.image }}

      - id: publish
        run: echo "image=${{ steps.vars.outputs.image }}" >> $GITHUB_OUTPUT

  deploy-frontend-prod:
    name: Deploy Frontend to Production
    needs:
      - build-frontend-prod
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE_PROD }}
          image: ${{ needs.build-frontend-prod.outputs.image }}
          region: ${{ vars.GCP_REGION }}
          flags: --allow-unauthenticated

      - name: Health check frontend Prod
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in {1..5}; do
            if curl -fsSL "$URL"; then
              echo "Frontend Prod healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Frontend Prod health check failed" >&2
          exit 1
