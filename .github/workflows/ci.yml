name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      CI: true
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run pytest (unit)
        working-directory: backend
        run: python -m pytest -m "not integration" --junitxml=pytest-unit.xml --maxfail=1 --disable-warnings

      - name: Upload pytest report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-tests
          path: backend/pytest-unit.xml
          if-no-files-found: ignore

      - name: Upload backend coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud Analysis
    needs:
      - frontend-tests
      - backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-tests:
    name: E2E (Cypress)
    needs:
      - frontend-tests
      - backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env for backend services
        run: |
          cat <<'EOF' > .env
          DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-polo52}:${POSTGRES_PASSWORD:-polo52}@db:5432/${POSTGRES_DB:-polo52}
          SECRET_KEY=${SECRET_KEY:-ci-secret}
          SESSION_SECRET_KEY=${SESSION_SECRET_KEY:-ci-session-secret}
          EMAIL_USER=${EMAIL_USER:-qa@example.com}
          EMAIL_PASS=${EMAIL_PASS:-qa-password}
          SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
          SMTP_PORT=${SMTP_PORT:-587}
          GOOGLE_API_KEY=${GOOGLE_API_KEY:-fake-api-key}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-fake-client-id}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-fake-client-secret}
          GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
          GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-2.0-flash}
          ENVIRONMENT=ci
          EOF
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      - name: Start backend stack
        run: docker compose -f docker-compose.dev.yml up -d db api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API ready"; exit 0
            fi
            sleep 3
          done
          echo "API never became ready" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps & run Cypress
        working-directory: frontend
        env:
          API_URL: http://localhost:8000
        run: |
          npm ci
          npm run e2e:ci

      - name: Stop backend stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down
