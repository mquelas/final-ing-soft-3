name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      CI: true
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt

      - name: Run pytest (unit)
        working-directory: backend
        run: python -m pytest -m "not integration" --junitxml=pytest-unit.xml --maxfail=1 --disable-warnings --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70

      - name: Upload pytest report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-tests
          path: |
            backend/pytest-unit.xml
            backend/coverage.xml
          if-no-files-found: ignore

  sonar-quality-gate:
    name: SonarCloud Quality Gate
    needs:
      - frontend-tests
      - backend-tests
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: artifacts/frontend

      - uses: actions/download-artifact@v4
        with:
          name: backend-unit-tests
          path: artifacts/backend

      - name: Normalize coverage paths
        run: |
          mkdir -p frontend/coverage backend
          BACKEND_COV=$(find artifacts -name 'coverage.xml' | head -n1)
          FRONTEND_LCOV=$(find artifacts -name 'lcov.info' | head -n1)
          if [ -z "$BACKEND_COV" ]; then
            echo "backend coverage.xml not found in artifacts"; exit 1;
          fi
          if [ -z "$FRONTEND_LCOV" ]; then
            echo "frontend lcov.info not found in artifacts"; exit 1;
          fi
          cp "$BACKEND_COV" backend/coverage.xml
          cp "$FRONTEND_LCOV" frontend/coverage/lcov.info

      - name: Verify coverage reports
        run: |
          ls -l frontend/coverage || true
          ls -l backend || true
          if [ ! -s frontend/coverage/lcov.info ]; then
            echo "lcov.info not found or empty"; exit 1; 
          fi
          if [ ! -s backend/coverage.xml ]; then
            echo "backend coverage.xml not found or empty"; exit 1;
          fi

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=mquelas_final-ing-soft-3
            -Dsonar.organization=mquelas
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.tests=backend/tests,frontend/src
            -Dsonar.exclusions=**/*.spec.ts,frontend/src/test.ts
            -Dsonar.test.inclusions=frontend/src/**/*.spec.ts
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
